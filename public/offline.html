<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kavach — Offline Mode</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #A5A79B;
        color: #1C0A0A;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        padding: 24px;
      }
      .card {
        background: #E8D2B5;
        border: 1px solid rgba(28, 10, 10, 0.18);
        border-radius: 20px;
        max-width: 480px;
        padding: 36px;
        box-shadow: 0 12px 32px rgba(28, 10, 10, 0.08);
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #590907;
        font-weight: 700;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 36px;
        margin: 0 0 12px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        background: #590907;
        color: #E8D2B5;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">● Offline · On-Device</div>
      <h1>KAVACH SOVEREIGN SHELL</h1>
      <p>You are currently offline. Your local IndexedDB vault, notes, tasks, and cached on-device weights remain accessible inside the main application shell.</p>
      <a href="/">Launch Cached Workspace</a>
    </div>
  </body>
</html>
